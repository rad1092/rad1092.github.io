{%- include urls.html -%}
{%- assign t = site.data.t[page.lang] -%}
<!doctype html>
<html lang="{{ page.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != t.name %}{{ page.title }} | {% endif %}{{ t.name }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="en" href="{{ en_url | absolute_url }}">
  <link rel="alternate" hreflang="ko" href="{{ ko_url | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ en_url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: t.name }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <script>
    // A language picked before wins; otherwise a browser set to Korean goes from
    // an English page to the same page in Korean. Everyone else stays put.
    (function () {
      try {
        var chosen = localStorage.getItem("hdk-language");
        var path = location.pathname;
        var onKo = path === "/ko" || path.indexOf("/ko/") === 0;
        var browser = (navigator.languages && navigator.languages[0]) || navigator.language || "";
        var want = chosen || (/^ko(-|$)/i.test(browser) ? "ko" : "");
        var rest = location.search + location.hash;
        if (want === "ko" && !onKo) location.replace("/ko" + path + rest);
        else if (want === "en" && onKo) location.replace((path.slice(3) || "/") + rest);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
  {%- if page.lang == "ko" %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  {%- endif %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">{{ t.skip }}</a>
  {% include header.html %}
  <main id="main">
{{ content }}
  </main>
  <footer class="site-footer">
    <p>© 2026 {{ t.name }}</p>
    <p><a href="mailto:rad174951@gmail.com">rad174951@gmail.com</a></p>
  </footer>
  <script>
    document.querySelectorAll("[data-lang]").forEach(function (link) {
      link.addEventListener("click", function () {
        try { localStorage.setItem("hdk-language", link.dataset.lang); } catch (e) {}
      });
    });
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.querySelectorAll("video[autoplay]").forEach(function (video) { video.pause(); video.removeAttribute("autoplay"); video.controls = true; });
    }
  </script>
</body>
</html>
